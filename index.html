<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة خاصة ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(135deg,#111827,#312e81,#7c3aed);
  overflow:hidden; color:white;
}
.card{
  width:min(90%,420px); padding:42px 25px; text-align:center;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
  border-radius:28px; backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.heart{font-size:55px; animation:pulse 1.5s infinite}
h1{font-size:32px;margin:12px 0}
p{font-size:21px;line-height:1.8;margin:12px 0 25px}
button{
  border:0;border-radius:999px;padding:13px 28px;font-size:18px;
  background:white;color:#4c1d95;font-weight:bold;cursor:pointer;
}
#reply{display:none;margin-top:20px;font-size:18px}
@keyframes pulse{50%{transform:scale(1.12)}}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>البشممرض بيمسي 😂</h1>
  <p>رسالة خاصة وصلت ليك...<br>خلي يومك حلو بقى 😎</p>
  <button onclick="document.getElementById('reply').style.display='block'">
    اضغط هنا 😂
  </button>
  <div id="reply">تم استلام البوسة بنجاح 😂❤️</div>
</div>
</body>
</html>
